<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICEN|Creacion de Formularios</title>

    <!--Enlaces a hojas de estilo en cascada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/rf-01.css" rel="stylesheet">

</head>
<body>

    <header>
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-light w-100 px-3 py-2 justify-content-between" data-bs-theme="light">                
                <div>
                    <figure class="m-0">
                        <img src="assets/logo-mep.png" alt="Logotipo del Ministerio de Educacion Publica" class="logo-mep">
                    </figure>
                </div>
                <div>
                    <h1 class="navbar-brand">Creacion de Formulario Censal</h1>
                </div>
                <div>
                    <button type="button" class="btn btn-primary">Volver</button>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container py-4">
            <form novalidate>

                
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-8">
                        <label for="nombre-formulario" class="form-label">Nombre del Formulario</label>
                        <input type="text" class="form-control" id="nombre-formulario" placeholder="Escriba el nombre del formulario" required>
                        <div class="invalid-feedback" id="error-nombre-formulario"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-12">

                        <!--Seccion 1-->
                        <div class="accordion" id="acordion-secciones">
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#seccion1"
                                    aria-expanded="true" aria-controls="seccion1">1. Informacion del centro</button>
                                </h2>
                                <div id="seccion1" class="accordion-collapse collapse show">
                                    <div class="accordion-body">
                                        <fieldset>
                                            <legend class="visually-hidden">Informacion del Centro</legend>
                                            <div class="row g-3">
                                                <div class="col-12">
                                                    <ul class="list-group mb-3" id="lista-campos-1"></ul>
                                                    <!--Agregar campo-->
                                                    <button type="button" class="btn btn-primary btn-agregar-campo" data-seccion-id="1">+ Agregar Campo</button>
                                                </div>
                                            </div>
                                        </fieldset>
                                    </div>
                                </div>
                            </div>

                            <!--Seccion 2-->
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#seccion2"
                                    aria-expanded="false" aria-controls="seccion2">2. Matricula</button>
                                </h2>
                                <div id="seccion2" class="accordion-collapse collapse">
                                    <div class="accordion-body">
                                        <fieldset>
                                            <legend class="visually-hidden">Matricula</legend>
                                            <div class="row g-3">
                                                <div class="col-12">
                                                    <ul class="list-group mb-3" id="lista-campos-2"></ul>
                                                    <!--Agregar campo-->
                                                    <button type="button" class="btn btn-primary btn-agregar-campo" data-seccion-id="2">+ Agregar Campo</button>
                                                </div>
                                            </div>
                                        </fieldset>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="guardar-plantilla">
                            <label class="form-check-label" for="flexCheckDefault">
                            Guardar Plantilla
                            </label>
                        </div>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-primary">+ Agregar Seccion</button>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-12 col-md-auto d-grid d-md-block">    
                        <button type="button" class="btn btn-primary">Guardar Borrador</button>
                    </div>
                    <div class="col-12 col-md-auto d-grid d-md-block">
                        <button type="button" class="btn btn-primary">Continuar</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div class="modal fade" id="modal-campo" tabindex="-1" aria-labelledby="titulo-modal-campo" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="titulo-modal-campo">Agregar Campo</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="nombre-campo" class="form-label">Nombre del campo</label>
                        <input type="text" class="form-control" id="nombre-campo" placeholder="Ejemplo: Cantidad de estudiantes" aria-describedby="error-nombre-campo">
                        <div class="invalid-feedback" id="error-nombre-campo"></div>
                    </div>
                    <div class="mb-3">
                        <label for="tipo-campo" class="form-label" >Tipo de dato</label>
                        <select class="form-select" id="tipo-campo" aria-describedby="error-tipo-campo">
                            <option value="">Seleccione un tipo</option>
                            <option value="texto">Texto</option>
                            <option value="numero">Numero</option>
                            <option value="fecha">Fecha</option>
                            <option value="seleccion">Seleccion</option>
                        </select>
                        <div class="invalid-feedback" id="error-tipo-campo"></div>
                    </div>
                    <fieldset class="mb-3">
                        <legend class="form-label fs-6">Obligatorio</legend>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="obligatorio" id="obligatorio-si" value="si">
                            <label for="obligatorio-si" class="form-check-label">Si</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="obligatorio" id="obligatorio-no" value="no">
                            <label for="obligatorio-no" class="form-check-label">No</label>
                        </div>
                        <div class="invalid-feedback d-block" id="error-obligatorio"></div>
                    </fieldset>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-confirmar-campo">Agregar</button>
                </div>
            </div>
        </div>
    </div>

    <template id="plantilla-campo">
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="nombre-campo"></span>
            <span>
                <span class="badge text-bg-secondary tipo-campo"></span>
                <span class="badge text-bg-warning obligatorio-campo"></span>
            </span>
        </li>
    </template>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/rf-01.js"></script>

</body>
</html>

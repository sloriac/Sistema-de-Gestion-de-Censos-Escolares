<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICEN|Creacion de Formularios</title>

    <!--Enlaces a hojas de estilo en cascada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/rf-01.css" rel="stylesheet">

</head>
<body>

    <header>
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-light w-100 px-3 py-2 justify-content-between" data-bs-theme="light">                
                <div>
                    <figure class="m-0">
                        <img src="assets/logo-mep.png" alt="Logotipo del Ministerio de Educacion Publica" class="logo-mep">
                    </figure>
                </div>
                <div>
                    <h1 class="navbar-brand">Creacion de Formulario Censal</h1>
                </div>
                <div>
                    <button type="button" class="btn btn-primary">Volver</button>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container py-4">
            <form>

                
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-8">
                        <label for="nombre-formulario" class="form-label ">Nombre del formulario <span class="badge bg-secondary">Obligatorio</span></label>
                        <input type="text" class="form-control is-invalid" id="nombre-formulario" placeholder="Escriba el nombre del formulario" required>
                        <div class="invalid-feedback"><p class="mb-0">El nombre del formulario es obligatorio.</p></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-12">
                        <div class="accordion" id="acordion-secciones">
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#seccion1"
                                    aria-expanded="true" aria-controls="seccion1">1. Informacion del centro</button>
                                </h2>
                                <div id="seccion1" class="accordion-collapse collapse show">
                                    <div class="accordion-body">
                                        <fieldset>
                                            <legend class="visually-hidden">Informacion del centro</legend>
                                            <div class="row g-3 align-items-end">
                                                <div class="col-12 col-md-6 col-lg-4">
                                                    <!--Nombre del centro-->
                                                    <label for="nombre-centro" class="form-label">Nombre del Centro Educativo</label>
                                                    <input type="text" class="form-control" id="nombre-centro" placeholder="Escriba el nombre del Centro Educativo">
                                                </div>
                                                <div class="col-12 col-md-6 col-lg-4">
                                                    <!--Codigo institucional-->
                                                    <label for="codigo-institucional" class="form-label ">Codigo Institucional</label>
                                                    <div class="input-group">
                                                        <span class="input-group-text">#</span>
                                                        <input type="text" class="form-control" id="codigo-institucional" placeholder="Escriba el codigo institucional">
                                                    </div>
                                                </div>
                                                <div class="col-12 col-md-6 col-lg-4">
                                                    <!--Director-->
                                                    <div class="form-floating">
                                                        <input type="text" class="form-control" id="nombre-director" placeholder="Escriba el nombre del director">
                                                        <label for="nombre-director">Nombre del Director</label>
                                                    </div>
                                                </div>
                                                <div class="col-12">
                                                    <!--Agregar campo-->
                                                    <button type="button" class="btn btn-primary">+ Agregar Campo</button>
                                                </div>
                                            </div>
                                        </fieldset>
                                    </div>
                                </div>
                            </div>
                  
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#seccion2"
                                    aria-expanded="false" aria-controls="seccion2">2. Matricula</button>
                                </h2>
                                <div id="seccion2" class="accordion-collapse collapse">
                                    <div class="accordion-body">
                                        <fieldset>
                                            <legend class="visually-hidden">Matricula</legend>
                                            <div class="row g-3">
                                                <div class="col-12 col-md-6 col-lg-4">
                                                    <!--Nombre del centro-->
                                                    <label for="cantidad-estudiantes" class="form-label ">Cantidad de estudiantes</label>
                                                    <input type="number" class="form-control" id="cantidad-estudiantes"  placeholder="Digite la cantidad de estudiantes">
                                                </div>
                                                <div class="col-12 col-md-6 col-lg-4">
                                                    <!--Codigo institucional-->
                                                    <label for="nivel-educativo" class="form-label ">Nivel educativo</label>
                                                    <select class="form-select" id="nivel-educativo">
                                                        <option value="">Seleccione un nivel</option>
                                                        <option>Preescolar</option>
                                                        <option>I Ciclo</option>
                                                        <option>II Ciclo</option>
                                                        <option>III Ciclo</option>
                                                        <option>Educacion Diversificada</option>
                                                    </select>
                                                </div>
                                                <div class="col-12 col-md-6 col-lg-4">
                                                    <!--Director-->
                                                    <label for="cantidad-grupos" class="form-label">Cantidad de grupos</label>
                                                    <input type="number" class="form-control" id="cantidad-grupos" placeholder="Digite la cantidad de grupos">
                                                </div>
                                                <div class="col-12">
                                                    <!--Agregar campo-->
                                                    <button type="button" class="btn btn-primary">+ Agregar Campo</button>
                                                </div>
                                            </div>
                                        </fieldset>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" value="" id="guardar-plantilla">
                            <label class="form-check-label" for="guardar-plantilla">
                            Guardar plantilla
                            </label>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-12 col-md-auto d-grid d-md-block">    
                        <button type="button" class="btn btn-primary">Guardar Borrador</button>
                    </div>
                    <div class="col-12 col-md-auto d-grid d-md-block">
                        <button type="button" class="btn btn-primary">Continuar</button>
                    </div>
                </div>
            </form>
            <div class="alert alert-info mt-3" role="alert">
                <p class="mb-0">Complete las secciones y presione "Continuar".</p>
            </div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>

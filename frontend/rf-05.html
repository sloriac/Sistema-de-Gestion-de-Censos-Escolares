<!DOCTYPE html>
<html lang="en">
<head>

                    </div>
                </div>
            </div>
        </div>
    </header>
    <div class="container py-4">
        <div class="row">
            <div class="col-2">
                <nav class="navbar navbar-expand-lg bg-light w-100 px-3 py-2 justify-content-between" data-bs-theme="light">
                    <ul class="nav flex-column list-unstyled">
                        <li class="nav-item">
                            <a href="">Inicio</a>
                        </li>
                        <li class="nav-item">

                                <tr>

                                </tr>
                                <tr>

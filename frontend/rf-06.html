<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICEN | Reportes Estadísticos - Jefatura DAE</title>

    <!--Enlaces a hojas de estilo en cascada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos-generales.css">
    <link href="css/rf-06.css" rel="stylesheet">

</head>

<body>

    <header>
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-light w-100 px-3 py-2 justify-content-between" data-bs-theme="light">                
                <div>
                    <figure class="m-0">
                        <img src="assets/logo-mep.png" alt="Logotipo del Ministerio de Educacion Publica" class="logo-mep">
                    </figure>
                </div>
                <div>
                    <h1 class="navbar-brand">Reportes estadísticos</h1>
                </div>
                <div>
                    <button type="button" class="btn btn-primary" id="btn-volver">Volver</button>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container py-4">
            <p class="alert d-none" role="alert" id="mensaje-resultado"></p>
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <form id="formulario-reportes" novalidate class="mb-3">

                        <div class="row mb-3">
                            <label for="periodo" class="form-label">Período</label>
                            <select id="periodo" class="form-select">
                                <option value="">Seleccione un período</option>
                            </select>
                        </div>

                        <div class="row mb-3">
                            <label for="region" class="form-label">Región</label>
                            <select id="region" class="form-select">
                                <option value="">Todas las regiones</option>
                            </select>
                        </div>

                        <div class="row mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select id="estado" class="form-select">
                                <option value="">Todos</option>
                            </select>
                        </div>

                        <div class="d-grid d-md-block text-center">
                            <button type="submit" class="btn btn-primary" id="btn-generar-reporte">Generar Reporte</button>
                        </div>
                    </form>

                </div>

            </div>

            <section id="seccion-resultados" class="d-none">
                
                <hr>

                <h2>Resultados</h2>
                <div class="row">
                    <div class="col-12 col-md-6">
                        <p class="d-flex justify-content-between">Centros registrados: <span id="centros-registrados"></span></p>
                        <p class="d-flex justify-content-between">Censos completados: <span id="censos-completados"></span></p>
                        <p class="d-flex justify-content-between">Censos pendientes: <span id="censos-pendientes"></span></p>
                        <p class="d-flex justify-content-between">Censos con observaciones: <span id="censos-observaciones"></span></p>
                    </div>
                    <div class="col-12 col-md-6 d-grid gap-3 justify-content-center align-content-center">
                        <button type="button" class="btn btn-primary" id="btn-descargar-excel">Descargar Excel</button>
                        <button type="button" class="btn btn-primary" id="btn-descargar-pdf">Descargar PDF</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/rf-06.js"></script>
    
</body>
</html>

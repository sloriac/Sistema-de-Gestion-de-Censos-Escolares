<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SICEN | Información del Centro Educativo</title>

    <!-- Hojas de estilo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <link rel="stylesheet" href="css/estilos-generales.css">
    <link rel="stylesheet" href="css/rf-10.css">
</head>

<body>

    <header>
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-light w-100 px-3 py-2 justify-content-between"
                 data-bs-theme="light">

                <div>
                    <figure class="m-0">
                        <img src="assets/logo-mep.png"
                             alt="Logotipo del Ministerio de Educación Pública"
                             class="logo-mep">
                    </figure>
                </div>

                <div>
                    <h1 class="navbar-brand">Creación de Formulario Censal</h1>
                </div>

                <div>
                    <button type="button" class="btn btn-primary" id="btn-volver">
                        Volver
                    </button>
                </div>

            </nav>
        </div>
    </header>

    <main>
        <div class="container py-4">

            <h2>Información del centro educativo</h2>

            <p>Revise la información de su centro educativo antes de continuar.</p>

            <div class="card mb-3">
                <div class="card-header">
                    Datos del centro educativo
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label for="nombre-centro" class="form-label">
                            Nombre del centro educativo
                        </label>

                        <input type="text"
                               class="form-control"
                               id="nombre-centro"
                               readonly>
                    </div>

                    <div class="mb-3">
                        <label for="codigo-centro" class="form-label">
                            Código del centro educativo
                        </label>

                        <input type="text"
                               class="form-control"
                               id="codigo-centro"
                               readonly>
                    </div>

                    <div class="mb-3">
                        <label for="oferta-educativa" class="form-label">
                            Oferta educativa autorizada
                        </label>

                        <input type="text"
                               class="form-control"
                               id="oferta-educativa"
                               readonly>
                    </div>

                    <p class="texto-ayuda">
                        Estos datos son de solo lectura y no se pueden modificar
                        desde esta pantalla.
                    </p>

                    <button type="button" class="btn btn-primary" id="btn-continuar">
                        Continuar
                    </button>

                    <p id="mensaje" class="mt-3 mb-0"></p>

                </div>
            </div>

        </div>
    </main>

    <script src="js/rf-10.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICEN | Registro de Colaboradores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos-generales.css">
    <link rel="stylesheet" href="css/rf-04.css">

</head>
<body>

    <header>
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-light w-100 px-3 py-2 justify-content-between" data-bs-theme="light">                
                <div>
                    <figure class="m-0">
                        <img src="assets/logo-mep.png" alt="Logotipo del Ministerio de Educacion Publica" class="logo-mep">
                    </figure>
                </div>
                <div>
                    <h1 class="navbar-brand">Gestion de Colaboradores</h1>
                </div>
                <div>
                    <button type="button" class="btn btn-primary">Volver</button>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container py-4">
            <form novalidate>
                <div class="row g-3 mb-3">
                    <!--Nombre colaborador-->
                    <div class="col-12 col-md-8">
                        <label for="nombre-colaborador" class="form-label">Nombre del colaborador</label>
                        <input type="text" class="form-control" id="nombre-colaborador" placeholder="Ejemplo: Sebastian Bocan" aria-describedby="error-nombre-colaborador">
                        <p class="invalid-feedback" id="error-nombre-colaborador"></p>
                    </div>
                    <!--Correo Institucional-->
                    <div class="col-12 col-md-8">
                        <label for="correo" class="form-label">Correo Institucional</label>
                        <input type="text" class="form-control" id="correo" placeholder="name@mep.go.cr" aria-describedby="error-correo">
                        <p class="invalid-feedback" id="error-correo"></p>
                    </div>
                    <!--Rol-->
                    <div class="col-12 col-md-8">
                            <label for="rol" class="form-label" >Rol</label>
                        <select class="form-select" id="rol" aria-describedby="error-rol">
                            <option value="">Seleccione un rol</option>
                            <option value="tecnico-dae">Tecnico DAE</option>
                            <option value="supervisor">Supervisor</option>
                        </select>
                        <p class="invalid-feedback" id="error-rol"></p>
                    </div>
                    <!--Estado-->
                    <div class="col-12 col-md-8">
                            <label for="estado" class="form-label" >Estado</label>
                        <select class="form-select" id="estado" aria-describedby="error-estado">
                            <option value="">Seleccione un estado</option>
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                        <p class="invalid-feedback" id="error-estado"></p>
                    </div>
                </div>
                
                    <!--Boton para registrarlo-->
                <div class="row g-3">
                        <div class="col-12 col-md-auto d-grid d-md-block">    
                            <button type="button" class="btn btn-primary">Cancelar</button>
                        </div>
                        <div class="col-12 col-md-auto d-grid d-md-block">
                            <button type="submit" class="btn btn-primary" id="btn-registrar">Registrar</button>
                        </div>
                    </div>
                    <!--Tabla de colaboradores registrados (Metodo GET)-->
                    <div class="row g-3 mt-3">
                        <div class="col-12">
                             <div class="table-responsive">
                                <table class="table table-stripped table-hover align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th scope="col">Nombre</th>
                                            <th scope="col">Correo Institucional</th>
                                            <th scope="col">Rol</th>
                                            <th scope="col">Estado</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-colaboradores"></tbody>
                                </table>
                            </div>
                            <!--Template para las filas de la tabla-->
                            <template id="plantilla-fila">
                                <tr>
                                    <td class="col-nombre fw-bold"></td>
                                    <td class="col-correo text-muted"></td>
                                    <td class="col-rol"><span class="badge text-bg-secondary badge-rol"></span></td>
                                    <td class="col-estado"></td>
                                </tr>
                            </template>
                        </div>
                    </div>
                </div>
            </form>
        </div>

    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/rf-04.js"></script>
</body>

</html>
